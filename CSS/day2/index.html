<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Classroom Details</title>
    <style>
        .title {
            color: #ffffff;
            background-color: #1e3a8a;
        }

        .section {
            background-color: #f8fafc;
        }

        .section-title {
            color: #1e40af;
            background-color: #e2e8f0;
        }

        .teacher {
            color: #0f172a;
            background-color: #dbeafe;
        }

        .student {
            color: #334155;
            background-color: #f1f5f9;
        }

        .topic {
            color: #854d0e;
            background-color: #fef9c3;
        }

        .status {
            color: #065f46;
            background-color: #d1fae5;
        }
    </style>
</head>
<body>

    <h1 class="title">CSS Class</h1>

    <div class="section">
        <h2 class="section-title">Teacher Information</h2>
        <p class="teacher">Teacher Name</p>
        <p class="teacher">Subject</p>
    </div>

    <div class="section">
        <h2 class="section-title">Student Information</h2>
        <p class="student">Arun</p>
        <p class="student">Priya</p>
        <p class="student">Kumar</p>
        <p class="student">Divya</p>
    </div>

    <div class="section">
        <h2 class="section-title">Today's Topics</h2>
        <p class="topic">HTML</p>
        <p class="topic">CSS</p>
        <p class="topic">JavaScript</p>
    </div>

    <div class="section">
        <h2 class="section-title">Class Status</h2>
        <p class="status">Class Started</p>
        <p class="status">Class In Progress</p>
        <p class="status">Class Completed</p>
    </div>

</body>
</html>
