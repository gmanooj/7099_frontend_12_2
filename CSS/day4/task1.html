<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 1 - Flex Direction</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            background-color: lightblue;
            padding: 10px;
            gap: 10px;
        }

        .box {
            background-color: white;
            padding: 20px;
            font-size: 18px;
            font-family: Arial, sans-serif;
            border: 2px solid darkblue;
        }
    </style>
</head>
<body>

    <h2>Task 1: Flex Direction</h2>

    <div class="container">
        <div class="box">HTML</div>
        <div class="box">CSS</div>
        <div class="box">JavaScript</div>
        <div class="box">React</div>
        <div class="box">Node.js</div>
    </div>

</body>
</html>
