<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Mini Product Page</title>
</head>
<body>

    <div>
        <h1>Laptop</h1>
        <p><strong>Price:</strong> ₹55,000</p>
    </div>

    <div>
        <h2>Features</h2>
        <ul>
            <li>16GB RAM</li>
            <li>512GB SSD</li>
            <li>Intel Processor</li>
            <li>15.6-inch Display</li>
        </ul>
    </div>

    <div>
        <h2>Product Specifications</h2>
        <table border="1">
            <tr>
                <th>Specification</th>
                <th>Details</th>
            </tr>
            <tr>
                <td>RAM</td>
                <td>16GB</td>
            </tr>
            <tr>
                <td>Storage</td>
                <td>512GB SSD</td>
            </tr>
            <tr>
                <td>Processor</td>
                <td>Intel Processor</td>
            </tr>
            <tr>
                <td>Display</td>
                <td>15.6-inch Display</td>
            </tr>
        </table>
    </div>

    <div>
        <h2>Order Form</h2>
        <form>
            <p>
                <label>Customer Name:</label><br>
                <input type="text" name="customer_name">
            </p>

            <p>
                <label>Email:</label><br>
                <input type="email" name="email">
            </p>

            <p>
                <label>Phone:</label><br>
                <input type="tel" name="phone">
            </p>

            <p>
                <label>Quantity:</label><br>
                <input type="number" name="quantity" value="1" min="1">
            </p>

            <p>
                <label>Address:</label><br>
                <textarea name="address" rows="4" cols="30"></textarea>
            </p>

            <p>
                <button type="submit">Order Now</button>
            </p>
        </form>
    </div>

</body>
</html>
