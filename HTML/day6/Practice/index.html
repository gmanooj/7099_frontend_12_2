<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <form>
        <table border="1" align="center" cellpadding="10" cellspacing="10">
            <div class="header" colspan="2" align="center">
                <h1>Your Information</h1>
            </div>
            <tr>
                <td>
                    <label for="first_name">First Name:</label>
                    <input type="text" id="first_name" name="first_name" required>
                </td>    
                <td>
                    <label for="last_name">Last Name:</label>   
                    <input type="text" id="last_name" name="last_name">
                </td>
            </tr>
            <tr>
                <td  class="email">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </td>
            </tr>
            <tr>
                <td class="phone">
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone" required>
                </td>
                <td class="gender">
                    <label>Gender:</label>
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="address">
                    <label for="address">Address:</label>
                    <input type="text" id="address" name="address">
                </td>
            </tr>
            <tr>
                <td  class="country">
                    <label for="country">Country:</label>
                    <select id="country" name="country">
                        <option value="">Select Country</option>
                        <option value="India">India</option>
                        <option value="China">China</option>
                        <option value="Russia">Russia</option>
                        <option value="Africa">Japan</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="languge">Languages:</label>
                </td>
                <td>
                    <input type="checkbox" id="language" name="language" value="english">
                    <label for="english">English</label>
                    <input type="checkbox" id="language" name="language" value="hindi">
                    <label for="hindi">Malayalam</label>
                    <input type="checkbox" id="language" name="language" value="marathi">
                    <label for="marathi">Telugu</label>
                </td>
            </tr>
            <tr>
                <td col="2" class="Qualifictaion">
                    <lable for="qualification">Qualifictaion</lable>
                    <input type="checkbox" id="qualification" name="qualification" value="highschool">
                    <label for="highschool">High School</label>
                    <input type="checkbox" id="qualification" name="qualification" value="diploma">
                    <label for="diploma">Diploma</label>
                    <input type="checkbox" id="qualification" name="qualification" value="degree">
                    <label for="degree">Degree</label>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="password">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="confirm-password">
                    <label for="confirm_password">Confirm Password:</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center" class="submit">
                    <button type="submit">Submit</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
